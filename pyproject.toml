[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "steamer"
version = "0.0.1"
authors = [
  { name="Crystal Wen", email="mccwen@umich.edu" },
]
description = "steamer package"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.setuptools]
packages = ["steamer"]
py-modules = ["__init__"] # dash, not underscore
